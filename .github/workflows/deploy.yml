name: CI/CD Multi-Environment Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build -- --configuration=production

      # Deploy to Dev Render Service (Placeholder until secret is added)
      - name: Trigger Render Dev Deployment
        if: github.ref == 'refs/heads/dev'
        run: |
          if [ -n "${{ secrets.RENDER_DEV_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEV_DEPLOY_HOOK }}"
          else
            echo "RENDER_DEV_DEPLOY_HOOK secret is not set yet. Skipping Render trigger."
          fi

      # Deploy to Production Render Service (Placeholder until secret is added)
      - name: Trigger Render Production Deployment
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"
          else
            echo "RENDER_PROD_DEPLOY_HOOK secret is not set yet. Skipping Render trigger."
          fi