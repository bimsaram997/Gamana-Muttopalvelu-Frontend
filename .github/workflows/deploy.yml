name: CI/CD Multi-Environment Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

jobs:
  trigger-render-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Trigger Render Dev Web Service on 'dev' branch
      - name: Trigger Render Dev Deployment
        if: github.ref == 'refs/heads/dev'
        run: |
          if [ -n "${{ secrets.RENDER_DEV_DEPLOY_HOOK }}" ]; then
            echo "Triggering Render Dev Deployment..."
            curl -X POST "${{ secrets.RENDER_DEV_DEPLOY_HOOK }}"
          else
            echo "RENDER_DEV_DEPLOY_HOOK secret is not set yet. Skipping Render trigger."
          fi

      # Trigger Render Production Web Service on 'main' branch
      - name: Trigger Render Production Deployment
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}" ]; then
            echo "Triggering Render Production Deployment..."
            curl -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"
          else
            echo "RENDER_PROD_DEPLOY_HOOK secret is not set yet. Skipping Render trigger."
          fi