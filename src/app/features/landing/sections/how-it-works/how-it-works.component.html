<section id="how-it-works" class="how-it-works-section py-5 bg-light">
  <div class="container py-lg-4">
    
    <!-- Section Header -->
    <div class="row justify-content-center text-center mb-5">
      <div class="col-lg-8">
        <span class="badge bg-danger bg-opacity-10 text-gamana-red fw-bold px-3 py-2 rounded-pill fs-7 mb-2">
          SIMPLE PROCESS
        </span>
        <h2 class="display-6 fw-black text-dark mb-3">
          How It <span class="text-gamana-red">Works</span>
        </h2>
        <p class="lead text-muted fs-6">
          Relocating or transferring furniture in Tampere is quick and transparent in three simple steps.
        </p>
      </div>
    </div>

    <!-- Steps Grid -->
    <div class="row g-4 justify-content-center">
      <div *ngFor="let step of steps" class="col-12 col-md-4">
        <div class="card h-100 border-0 shadow-sm rounded-4 p-4 text-center bg-white position-relative hover-card">
          
          <!-- Step Number Badge -->
          <div class="step-number position-absolute top-0 end-0 m-3 fw-black text-muted opacity-25 fs-2">
            {{ step.number }}
          </div>

          <!-- Step Icon Circle -->
          <div class="icon-wrapper bg-gamana-burgundy text-white rounded-circle mx-auto mb-4 d-flex align-items-center justify-content-center shadow-sm">
            <mat-icon class="fs-2">{{ step.icon }}</mat-icon>
          </div>

          <h3 class="fw-bold text-dark fs-5 mb-3">{{ step.title }}</h3>
          
          <p class="text-muted fs-7 mb-0">
            {{ step.description }}
          </p>

        </div>
      </div>
    </div>

    <!-- Call to Action -->
    <div class="mt-5 text-center">
      <a 
        routerLink="/booking" 
        class="btn btn-gamana-red rounded-pill px-4 py-3 fw-bold fs-6 shadow-sm text-decoration-none">
        Book Your Move Now &rarr;
      </a>
    </div>

  </div>
</section>
