<section id="aboutUs" class="hero-section position-relative d-flex align-items-center py-5">
  <!-- Dark Background Overlay -->
  <div class="hero-overlay"></div>

  <div class="container position-relative z-2 py-lg-5">
    <div class="row align-items-center">

      <!-- Left Column: Revised Copy, Services Checklist, and Actions -->
      <div class="col-lg-7 text-white">

        <!-- Top Small Tagline -->
        <span class="text-uppercase fw-bold text-gamana-red tracking-widest fs-8 d-block mb-2">
          {{ t('hero.tagline') }}
        </span>

        <!-- Main Headline -->
        <h1 class="display-3 fw-black text-white mb-3 tracking-tight">
          {{ t('hero.title_main') }} <span class="text-gamana-red">{{ t('hero.title_city') }}</span>
        </h1>

        <!-- Revised Description Copy -->
        <p class="lead fw-medium text-white-80 mb-4">
          {{ t('hero.description') }}
        </p>

        <!-- Key Services Checkbox Grid -->
        <div class="services-card bg-gamana-burgundy text-white p-4 rounded-4 shadow-sm mb-4 border border-secondary border-opacity-25">
          <h5 class="fw-bold text-uppercase text-gamana-red mb-3 d-flex align-items-center gap-2">
            <mat-icon>local_shipping</mat-icon> {{ t('hero.our_services') }}
          </h5>

          <!-- Services from backend with DTO translation helper -->
          <div class="row g-3 fw-semibold fs-7">
            <div *ngFor="let service of keyServices" class="col-sm-6 d-flex align-items-center gap-2">
              <mat-icon class="text-gamana-red">check_box</mat-icon>
              <span>{{ getTranslation(service.translations)?.name }}</span>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="d-flex flex-wrap align-items-center gap-3 pt-2">
          <!-- Primary Book Now Button -->
          <button 
            type="button"
            (click)="goToBooking()"
            class="btn btn-gamana-red rounded-pill px-4 py-3 fw-bold fs-6 shadow text-decoration-none">
            {{ t('hero.book_now') }} &rarr;
          </button>

          <!-- Request an Offer Button -->
          <button 
            type="button"
            (click)="gotoOffer()"
            class="btn btn-outline-light rounded-pill px-4 py-3 fw-bold fs-6 shadow-sm text-decoration-none">
            {{ t('hero.request_offer') }}
          </button>

          <!-- WhatsApp Quick Contact -->
          <a 
            href="https://wa.me/358414714856" 
            target="_blank" 
            class="btn btn-success rounded-pill px-3 py-3 fw-bold d-flex align-items-center gap-2 text-decoration-none shadow-sm ms-lg-2">
            <i class="bi bi-whatsapp fs-5"></i>
          </a>
        </div>

      </div>

    </div>
  </div>
</section>
