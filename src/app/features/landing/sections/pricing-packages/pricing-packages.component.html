<section id="pricing" class="pricing-section py-5 bg-light">
  <div class="container py-lg-4">
    
    <!-- Section Header -->
    <div class="row justify-content-center text-center mb-5">
      <div class="col-lg-8">
        <span class="badge bg-danger bg-opacity-10 text-gamana-red fw-bold px-3 py-2 rounded-pill fs-7 mb-2">
          TRANSPARENT RATES
        </span>
        <h2 class="display-6 fw-black text-dark mb-3">
          Affordable Pricing <span class="text-gamana-red">Packages</span>
        </h2>
        <p class="lead text-muted fs-6">
          No hidden fees. Choose the level of service that best fits your move in Tampere and surrounding areas.
        </p>
      </div>
    </div>

    <!-- Pricing Cards Grid -->
    <div class="row g-4 align-items-center justify-content-center">
      <div *ngFor="let pkg of packages" class="col-12 col-md-6 col-lg-4">
        <div 
          class="card border-0 shadow-sm rounded-4 p-4 text-center bg-white position-relative pricing-card"
          [class.featured-card]="pkg.popular">
          
          <!-- Popular Badge -->
          <div *ngIf="pkg.popular" class="popular-badge bg-gamana-red text-white fw-bold px-3 py-1 rounded-pill fs-8 position-absolute top-0 start-50 translate-middle shadow-sm">
            MOST POPULAR
          </div>

          <h3 class="fw-bold text-dark fs-4 mb-2 mt-2">{{ pkg.title }}</h3>
          <p class="text-muted fs-7 mb-3 px-2">{{ pkg.description }}</p>

          <!-- Price Display -->
          <div class="py-3 bg-light rounded-3 mb-4">
            <span class="display-5 fw-black text-dark">{{ pkg.price }}</span>
            <span class="text-muted fw-semibold fs-7 d-block text-uppercase tracking-wider">{{ pkg.unit }}</span>
          </div>

          <!-- Feature List -->
          <ul class="list-unstyled text-start fs-7 d-flex flex-column gap-2 mb-4 px-2">
            <li *ngFor="let feature of pkg.features" class="d-flex align-items-center gap-2 text-dark fw-semibold">
              <mat-icon class="text-gamana-red fs-6">check_circle</mat-icon>
              <span>{{ feature }}</span>
            </li>
          </ul>

          <!-- CTA Button -->
          <a 
            routerLink="/booking" 
            class="btn rounded-pill w-100 py-3 fw-bold fs-6 shadow-sm text-decoration-none mt-auto"
            [ngClass]="pkg.popular ? 'btn-gamana-red' : 'btn-outline-dark'">
            Book This Package &rarr;
          </a>

        </div>
      </div>
    </div>

  </div>
</section>
