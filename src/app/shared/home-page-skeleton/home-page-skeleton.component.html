<div class="home-skeleton">

  <!-- =========================
       HERO SKELETON
  ========================== -->
  <section class="hero-skeleton">

    <div class="hero-skeleton-content">

      <div class="skeleton skeleton-small-label"></div>

      <div class="skeleton skeleton-hero-title"></div>
      <div class="skeleton skeleton-hero-title second"></div>

      <div class="skeleton skeleton-hero-text"></div>
      <div class="skeleton skeleton-hero-text short"></div>

      <div class="hero-buttons">
        <div class="skeleton skeleton-button"></div>
        <div class="skeleton skeleton-button secondary"></div>
      </div>

    </div>

    <div class="skeleton skeleton-hero-image"></div>

  </section>


  <!-- =========================
       HOW IT WORKS
  ========================== -->
  <section class="skeleton-section">

    <div class="section-heading">

      <div class="skeleton skeleton-subtitle"></div>

      <div class="skeleton skeleton-section-title"></div>

      <div class="skeleton skeleton-description"></div>
      <div class="skeleton skeleton-description short"></div>

    </div>


    <div class="how-it-works-grid">

      <div
        class="skeleton-info-card"
        *ngFor="let item of [1, 2, 3]"
      >

        <div class="skeleton skeleton-icon"></div>

        <div class="skeleton skeleton-card-title"></div>

        <div class="skeleton skeleton-card-text"></div>
        <div class="skeleton skeleton-card-text"></div>
        <div class="skeleton skeleton-card-text short"></div>

      </div>

    </div>

  </section>


  <!-- =========================
       SERVICES
  ========================== -->
  <section class="skeleton-section services-section">

    <div class="section-heading">

      <div class="skeleton skeleton-subtitle"></div>

      <div class="skeleton skeleton-section-title"></div>

      <div class="skeleton skeleton-description"></div>
      <div class="skeleton skeleton-description short"></div>

    </div>


    <div class="services-grid">

      <div
        class="service-skeleton-card"
        *ngFor="let item of [1, 2, 3]"
      >

        <div class="skeleton skeleton-service-image"></div>

        <div class="service-card-content">

          <div class="skeleton skeleton-card-title"></div>

          <div class="skeleton skeleton-card-text"></div>
          <div class="skeleton skeleton-card-text"></div>
          <div class="skeleton skeleton-card-text short"></div>

          <div class="skeleton skeleton-read-more"></div>

        </div>

      </div>

    </div>

  </section>


  <!-- =========================
       PRICING
  ========================== -->
  <section class="skeleton-section pricing-section">

    <div class="section-heading">

      <div class="skeleton skeleton-subtitle"></div>

      <div class="skeleton skeleton-section-title"></div>

      <div class="skeleton skeleton-description"></div>
      <div class="skeleton skeleton-description short"></div>

    </div>


    <div class="pricing-grid">

      <div
        class="pricing-skeleton-card"
        *ngFor="let item of [1, 2, 3]"
      >

        <div class="skeleton skeleton-plan-title"></div>

        <div class="skeleton skeleton-price"></div>

        <div class="skeleton skeleton-price-period"></div>

        <div class="pricing-features">

          <div
            class="skeleton skeleton-feature"
            *ngFor="let feature of [1, 2, 3, 4, 5]"
          ></div>

        </div>

        <div class="skeleton skeleton-pricing-button"></div>

      </div>

    </div>

  </section>


  <!-- =========================
       TESTIMONIALS
  ========================== -->
  <section class="skeleton-section testimonials-section">

    <div class="section-heading">

      <div class="skeleton skeleton-subtitle"></div>

      <div class="skeleton skeleton-section-title"></div>

      <div class="skeleton skeleton-description"></div>

    </div>


    <div class="testimonials-grid">

      <div
        class="testimonial-skeleton-card"
        *ngFor="let item of [1, 2, 3]"
      >

        <div class="testimonial-header">

          <div class="skeleton skeleton-avatar"></div>

          <div class="testimonial-user">

            <div class="skeleton skeleton-user-name"></div>

            <div class="skeleton skeleton-user-role"></div>

          </div>

        </div>


        <div class="testimonial-rating">

          <div
            class="skeleton skeleton-star"
            *ngFor="let star of [1, 2, 3, 4, 5]"
          ></div>

        </div>


        <div class="skeleton skeleton-review-text"></div>
        <div class="skeleton skeleton-review-text"></div>
        <div class="skeleton skeleton-review-text short"></div>

      </div>

    </div>

  </section>


  <!-- =========================
       FOOTER
  ========================== -->
  <section class="footer-skeleton">

    <div class="footer-columns">

      <div class="footer-column">

        <div class="skeleton skeleton-footer-logo"></div>

        <div class="skeleton skeleton-footer-text"></div>
        <div class="skeleton skeleton-footer-text"></div>
        <div class="skeleton skeleton-footer-text short"></div>

      </div>


      <div class="footer-column">

        <div class="skeleton skeleton-footer-title"></div>

        <div class="skeleton skeleton-footer-link"></div>
        <div class="skeleton skeleton-footer-link"></div>
        <div class="skeleton skeleton-footer-link"></div>
        <div class="skeleton skeleton-footer-link"></div>

      </div>


      <div class="footer-column">

        <div class="skeleton skeleton-footer-title"></div>

        <div class="skeleton skeleton-footer-link"></div>
        <div class="skeleton skeleton-footer-link"></div>
        <div class="skeleton skeleton-footer-link"></div>
        <div class="skeleton skeleton-footer-link"></div>

      </div>


      <div class="footer-column">

        <div class="skeleton skeleton-footer-title"></div>

        <div class="skeleton skeleton-footer-link"></div>
        <div class="skeleton skeleton-footer-link"></div>
        <div class="skeleton skeleton-footer-link"></div>

      </div>

    </div>

  </section>

</div>
